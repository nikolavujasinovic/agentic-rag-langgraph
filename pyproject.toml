[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG orchestration with LangGraph: planning, corrective retrieval, citations, checkpointing and circuit breakers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
